<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MMAUG Tooling Lab</title>
  <style>
    body { margin:0; background:#0f172a; color:#e2e8f0; font:20px system-ui; }
    main { max-width:800px; margin:60px auto; padding:32px; }
    h1 { color:#22d3ee; font-size:44px; }
    button { background:#4f46e5; color:white; border:0; padding:14px 24px; font:inherit; cursor:pointer; }
    pre { background:#1e293b; padding:24px; white-space:pre-wrap; }
    a { color:#67e8f9; }
    #message { font-size:28px; }
  </style>
</head>
<body><main>
  <p>MMAUG / DevOps Tooling</p>
  <h1>One application, several tools</h1>
  <p id="message">Loading the application message…</p>
  <button id="request">Send one request</button>
  <pre id="result"></pre>
  <p>Docker packages this app. Terraform creates its container. Kubernetes can run the same image.</p>
  <p>Ansible supplies a message. Prometheus reads metrics. Grafana displays them.</p>
  <p><a href="/health">Health</a> &nbsp; <a href="/metrics">Metrics</a></p>
</main>
<script>
  async function load() {
    const result = await fetch('/api/hello').then(response => response.json());
    document.querySelector('#message').textContent = result.message;
    document.querySelector('#result').textContent = JSON.stringify(result, null, 2);
  }
  document.querySelector('#request').addEventListener('click', load);
  load();
</script>
</body></html>
