apiVersion: apps/v1
kind: Deployment
metadata:
  name: tooling-web
  namespace: mmaug-tooling
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tooling-web
  template:
    metadata:
      labels:
        app: tooling-web
    spec:
      containers:
        - name: web
          image: mmaug-tooling:1.0
          imagePullPolicy: Never
          env:
            - name: APP_MESSAGE
              value: "Hello from Kubernetes"
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
